<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>사용법 모션 시작 틀</title>
<!--
  [공용]     = 사용법 모션 엔진 그대로 (engine/usage/ 에서 복사)
  [기능마다] = 새 사용법 모션의 시작 틀. 장면 1개, 가짜 앱 창, 클릭 1번, 화면 전환 1번, 처음으로 돌아가기. 이 파일의 [기능마다] 부분을 제품에 맞게 바꾼다.
-->
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
/* [공용] 무대, 보기 방식 */
html,body{margin:0;background:#ddd;font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;}
body.box{background:#fff;}
body.export{background:#f2f4f6;}
#wrap{position:relative;margin:20px auto 0;overflow:hidden;}
body.box #wrap{border-radius:32px;margin-top:40px;}
body.export #wrap{margin:0;}
body.export #ui{display:none;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#f2f4f6;overflow:hidden;}
#stage div{position:absolute;}
#stage .capBig div,#stage .chip div,#stage .fl div,#stage .fl span{position:static;}
.img{background-repeat:no-repeat;}
.shadow{box-shadow:0 12px 40px rgba(0,0,0,.08);}
/* [공용] 단계 문구: 칩(PC). 번호 칸 파랑 rgb(31,102,241) */
.chip{left:960px;top:17px;height:56px;display:flex;align-items:center;gap:12px;padding:0 28px 0 8px;background:#fff;border-radius:28px;white-space:nowrap;box-shadow:0 12px 40px rgba(0,0,0,.08);}
.chip b{width:40px;height:40px;border-radius:20px;background:rgb(31,102,241);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.chip .role{font-size:27px;font-weight:600;color:#666;}
.chip .role:empty{display:none;}
.chip .ttl{font-size:29px;font-weight:800;color:#000;letter-spacing:-.02em;}
/* [공용] 클릭 효과, 커서 */
#fx{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
#cursor{position:absolute;left:0;top:0;width:30px;height:44px;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));transform-origin:2px 2px;}
.dot{width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(0,0,0,.28);box-shadow:0 0 0 2px #fff inset;}
#ui{display:flex;align-items:center;gap:12px;margin:14px auto;font:13px/1 ui-monospace,Menlo,monospace;color:#000;}
#ui input{flex:1;}
#ui button{font:inherit;padding:4px 10px;}
[contenteditable]{outline:none;caret-color:#3182f3;}



/* ======================= [기능마다] 화면 배치 ======================= */
/* 장면 문장 자리: x 120, 위 문장 y 114 h 48 40px 700, 아래 문장 y 166 h 44 34px 600 */
/* 장면 문장 자리(문서 설명 모션 kit.SENT 와 같음): x 120, 위 문장 y 114 h 48 40px 700, 아래 문장 y 166 h 44 34px 600 */
.sent{left:120px;white-space:nowrap;font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;color:rgb(25,31,40);-webkit-font-smoothing:antialiased;}
.sent.l1{top:114px;height:48px;line-height:48px;font-size:40px;font-weight:700;}
.sent.l2{top:166px;height:44px;line-height:44px;font-size:34px;font-weight:600;}

/* 앱 창: 1280×820 CSS 를 1.0배, 가로 가운데, 문장 자리 아래 y 240~1060 */
#win{left:320px;top:240px;width:1280px;height:820px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);}
#app{left:0;top:0;width:1280px;height:820px;transform-origin:0 0;overflow:hidden;background:#fff;}
.pt{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:rgb(26,31,39);}
.btn{border-radius:10px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box;background:#1f66f1;color:#fff;}
/* 문제 박스(무대 px) */
.issue{display:flex;align-items:center;gap:12px;padding:12px 22px 12px 12px;background:#fdf3e7;color:#b25e09;border:1.5px solid rgba(178,94,9,.3);border-radius:14px;font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:24px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;box-shadow:0 12px 32px rgba(0,0,0,.14);-webkit-font-smoothing:antialiased;}
.issue b{background:#b25e09;color:#fff;font-size:18px;font-weight:800;padding:4px 10px;border-radius:8px;letter-spacing:0;}
/* [기능마다] 발표 모드: 기본 보기 페이지(?box=1, ?export=1, ?embed=1 은 바꾸기 전 엔진 그대로). 무대 밖 조작 영역은 숨기고 DOM 은 남긴다 */
html.deck,html.deck body{background:#f2f4f6;}
html.deck body{overflow:hidden;}
html.deck #wrap{margin:0 auto;}
html.deck #ui{display:none;}
/* [기능마다] 발표 모드: 무대 안 조작 요소(기준 무대 좌표). 앱 창 양옆 빈 곳(폭 320) 아래 구석에 둔다 */
html.deck #stage{cursor:pointer;user-select:none;-webkit-user-select:none;}
html:not(.deck) #prev,html:not(.deck) #autoLbl,html:not(.deck) #stage #prog{display:none;}
#prev{position:absolute;left:24px;bottom:28px;height:44px;padding:0 20px;box-sizing:border-box;border:0;border-radius:22px;background:#fff;display:flex;align-items:center;gap:8px;font:700 20px "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:#333d4b;cursor:pointer;-webkit-appearance:none;appearance:none;}
#prev:hover:not(:disabled){background:#e5e8eb;}
#prev:disabled{opacity:.35;cursor:default;}
#prev svg{flex:none;width:16px;height:16px;}
#autoLbl{position:absolute;right:16px;bottom:28px;height:44px;display:flex;align-items:center;gap:10px;font:500 20px "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:#6b7684;cursor:pointer;}
#autoLbl input{margin:0;width:20px;height:20px;accent-color:rgb(31,102,241);cursor:pointer;}
#stage #prog{right:16px;bottom:84px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap;-webkit-font-smoothing:antialiased;}
#prog b{font-size:22px;font-weight:700;color:#333d4b;}
#prog span{font-size:15px;font-weight:500;color:#6b7684;}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <!-- [기능마다] 앱 창: 화면을 HTML 로 그린다(캡처 PNG 를 쓰면 IMG 와 patch 로 바꾼다). 새 모션에서는 이 안을 제품 화면으로 바꾼다 -->
  <div id="win">
    <div id="app" class="pt">
      <div id="vA" style="left:0;top:0;width:1280px;height:820px">
        <div style="left:60px;top:40px;font-size:28px;font-weight:700">화면 이름</div>
        <div id="btnA" class="btn" style="left:60px;top:120px;width:160px;height:48px">버튼</div>
      </div>
      <div id="vB" style="left:0;top:0;width:1280px;height:820px">
        <div style="left:60px;top:40px;font-size:28px;font-weight:700">결과 화면</div>
        <div style="left:60px;top:120px;font-size:18px;color:#6b7684">버튼을 누르면 이 화면이 열립니다</div>
      </div>
      <div id="veil" style="left:0;top:0;width:1280px;height:820px;background:#fff"></div>
    </div>
  </div>
  <!-- [공용] 효과 층 (순서 유지: 효과 → 문구 → 커서) -->
  <div id="fxDiv" style="inset:0;pointer-events:none"></div>
  <svg id="fx" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="curDisc" style="border-radius:50%;background:rgba(237,255,0,.35);display:none"></div>
  <!-- [기능마다] 문제 박스 (무대 px, 강조 선 위) -->
  <div id="issues" style="inset:0;pointer-events:none"></div>
  <!-- [공용 구조] 단계 문구 -->
  <div id="sents"></div>
  <div id="cap1" class="chip"><b>1</b><span class="role">역할</span><span class="ttl">질문 형태의 제목</span></div>
  <div id="dots"></div>
  <svg id="cursor" viewBox="0 0 15 22"><path d="M1 1 L1 17.6 L5.1 13.7 L7.9 20.2 L10.7 19 L7.9 12.7 L13.5 12.7 Z" fill="#000" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg>
  <!-- [기능마다] 발표 모드: 이전 버튼, 진행 표시와 안내, 자동 전환 -->
  <button type="button" id="prev"><svg viewBox="0 0 16 16" fill="none" stroke="#333d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,2.5 4.5,8 10,13.5"/></svg>이전</button>
  <div id="prog"><b id="progN"></b><span>클릭하거나 → 키로 넘김</span></div>
  <label id="autoLbl"><input type="checkbox" id="auto" /><span>자동 전환</span></label>

<div id="ui"><button id="pp">재생/정지</button><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span id="tm">0.00 s</span></div>
<script src="click-fx.js?v=4"></script>
<script src="motion-steps.js?v=1"></script>
<script>

// ======================= [기능마다] 데이터 =======================
const IMG={};   // 캡처 PNG 를 쓰는 모션이면 {키: ['pages/이름.png', CSS폭, CSS높이]} 로 채운다
const APP={x:320,y:240,s:1,w:1280,h:820};   // 앱 창 왼쪽 위(무대 px), 배율
const R={btn:{x:60,y:120,w:160,h:48}};      // 앱 안 사각형(CSS px, 앱 왼쪽 위 기준). 캡처로 재서 옮겨 적는다
// 문제 박스: 필요하면 {id: {txt, rings: ()=>[사각형], box: {x, y, ax: 'l'|'c'|'r', ay: 't'|'b'}}} 로 채운다. id 는 단계 표의 ring 단계 id 와 같다
const ISS={};

// ======================= [공용] 수학, 도구 =======================
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>b<=a?(t>=b?1:0):clamp((t-a)/(b-a));
const ioC=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const oC=p=>1-Math.pow(1-p,3);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=id=>document.getElementById(id);
function bez(p){const x1=.3,y1=0,x2=.12,y2=1;let lo=0,hi=1,u=p;for(let i=0;i<24;i++){u=(lo+hi)/2;const x=3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u;if(x<p)lo=u;else hi=u;}return 3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u;}
function patch(el,key,src,dst){const [url,W,H]=IMG[key],sx=dst.w/src.w,sy=dst.h/src.h,st=el.style;
  st.backgroundImage=`url(${url})`;st.left=dst.x+'px';st.top=dst.y+'px';st.width=dst.w+'px';st.height=dst.h+'px';st.backgroundSize=`${W*sx}px ${H*sy}px`;st.backgroundPosition=`${-src.x*sx}px ${-src.y*sy}px`;}
const full=(el,key,x=0,y=0)=>{const [,W,H]=IMG[key];patch(el,key,{x:0,y:0,w:W,h:H},{x,y,w:W,h:H});};
function show(el,o){el.style.opacity=o;el.style.display=o<=0.001?'none':'';}
const ctr=b=>[b.x+b.w/2,b.y+b.h/2];
const NS='http://www.w3.org/2000/svg',fx=$('fx');
const mk=(tag,a,p=fx)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const place=(el,b)=>{Object.assign(el.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});};
const typed=(ts,t)=>{let n=0;if(ts)while(n<ts.length&&ts[n]<=t)n++;return n;};

// ======================= [공용] 값 =======================
const q=new URLSearchParams(location.search);
const LOCAL=q.get('params')==='local';
let P=MotionSteps.defaults(),CP=ClickFX.defaults();
let T,BASE,DURATION,SPEED,VARIANT,FXP;


// ======================= [기능마다] 배치, 좌표 =======================
const aBox=r=>({x:APP.x+r.x*APP.s,y:APP.y+r.y*APP.s,w:r.w*APP.s,h:r.h*APP.s,s:APP.s});
const MEAS={};
const navMid=id=>T[id].s+T[id].v.out/1000;
const NAVS=['s1_nav1'];
function page(t){return t<navMid('s1_nav1')?'a':t<navMid('s1_loop')?'b':'a';}   // 화면 상태: 시간에 따라 하나를 고른다

// ======================= [공용 틀 + 기능마다 목록] 클릭, 강조, 커서 이동 =======================
let clicks=[],rings=[],moves=[];
const cur0=[1500,1170];   // 커서 출발점(무대 밖 아래)
const withR=(b,r)=>({...b,r:r*b.s});
function rebuild(){
  const C=MotionSteps.compute(P);
  T=C.T;BASE=C.BASE;SPEED=P.speed;DURATION=C.DURATION;window.DURATION=DURATION;window.T=T;window.STEPS=C;
  VARIANT=P.clickVariant;FXP=CP[VARIANT];
  clicks.forEach(c=>{ClickFX.destroyOverlay(c.o);if(c.dot)c.dot.remove();});rings.forEach(r=>r.el.remove());clicks=[];rings=[];
  const fxOf=id=>{const v=P.steps[id]||{},V=v.fx||VARIANT;let FP=CP[V];
    if(v.fx&&v.fxParams){FP=JSON.parse(JSON.stringify(ClickFX.defaults()[V]));for(const k in v.fxParams)for(const f in v.fxParams[k])if(FP[k]&&typeof v.fxParams[k][f]==='number')FP[k][f]=v.fxParams[k][f];}
    return {V,FP};};
  const add=(tc,ptFn,boxFn,{touch=false,dark=false,ring=null,id}={})=>{const {V,FP}=fxOf(id);
    const c={id,tc,pt:ptFn(tc),box:boxFn(tc),touch,dark,V,FP,o:ClickFX.buildOverlay(fx,$('fxDiv'),V)};
    if(touch){c.dot=document.createElement('div');c.dot.className='dot';$('dots').appendChild(c.dot);}
    clicks.push(c);if(ring)rings.push(ring);};
  // [기능마다] 클릭 대상(무대 좌표)
  const TG={s1_clickBtn:aBox(R.btn)};
  const RAD={s1_clickBtn:10};
  const PT={};
  const ptOf=id=>(PT[id]||ctr)(TG[id]);
  for(const id in TG)add(T[id].press,()=>ptOf(id),()=>withR(TG[id],RAD[id]),{dark:false,id});
  // [기능마다] 강조(파랑 = 보기, 주황 = 문제)
  const hr=(boxFn,id,pad=8,color='rgb(31,102,241)')=>{const r=T[id];return {boxFn,t0:r.s,t1:r.e,fi:r.v.in/1000,fo:r.v.out/1000,id,pad,color};};
  for(const id in ISS)ISS[id].rings().forEach((_,i)=>rings.push(hr(()=>ISS[id].rings()[i],id,6,'#b25e09')));
  rings.forEach(r=>{r.el=mk('rect',{fill:'none',stroke:r.color,'stroke-width':r.color==='#b25e09'?4:3,rx:12});fx.insertBefore(r.el,fx.firstChild);});
  // [기능마다] 커서 이동 목록: [glide 단계, 도착 클릭 단계]
  const MV=[['s1_glideBtn','s1_clickBtn']];
  moves=MV.map(([g,c])=>({t0:T[g].s,t1:T[g].e,k:T[g].v.curve/100,to:ptOf(c),id:g}));
  $('stage').appendChild($('dots'));$('stage').appendChild($('curDisc'));$('stage').appendChild($('cursor'));
}
function cursorAt(t){let p0=cur0;
  for(const m of moves){if(t<m.t0)return p0;
    if(t<=m.t1){const p=bez(seg(t,m.t0,m.t1)),[ax,ay]=p0,[bx,by]=m.to,dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
      const cx=(ax+bx)/2+(-dy/len)*len*m.k,cy=(ay+by)/2+(dx/len)*len*m.k,u=1-p;return [u*u*ax+2*u*p*cx+p*p*bx,u*u*ay+2*u*p*cy+p*p*by];}
    p0=m.to;}
  return p0;}
const cursorOn=t=>t>=T.s1_glideBtn.s-0.2&&t<T.s1_loop.s;
const inside=(p,b)=>p&&p[0]>=b.x&&p[0]<=b.x+b.w&&p[1]>=b.y&&p[1]<=b.y+b.h;

// ======================= [기능마다] 그린 요소 만들기, 재기 (글꼴을 불러온 뒤) =======================
function build(){
  for(const id in ISS){const d=document.createElement('div');d.className='issue';d.id='iss_'+id;d.innerHTML='<b>문제</b><span></span>';d.querySelector('span').textContent=ISS[id].txt;$('issues').appendChild(d);}
  for(const n in MotionSteps.SENTENCES)MotionSteps.SENTENCES[n].forEach((s,i)=>{const d=document.createElement('div');d.className='sent l'+(i+1);d.id='sent'+n+'_'+(i+1);d.textContent=s;$('sents').appendChild(d);});
}
build();
function measure(){
  const zk=$('stage').style.zoom;$('stage').style.zoom=1;
  for(const id in ISS){const el=$('iss_'+id),d=el.style.display;el.style.display='';MEAS[id]={w:el.offsetWidth,h:el.offsetHeight};el.style.display=d;}
  $('stage').style.zoom=zk;
  for(const id in ISS){const b=ISS[id].box,el=$('iss_'+id),m=MEAS[id];
    const p=[APP.x+b.x*APP.s,APP.y+b.y*APP.s];
    el.style.left=(b.ax==='r'?p[0]-m.w:b.ax==='c'?p[0]-m.w/2:p[0])+'px';el.style.top=(b.ay==='b'?p[1]-m.h:p[1])+'px';}
}

// ======================= render(t): t = 실제 초. 모든 스타일을 t 하나로 정한다(애니메이션, 난수 없음) =======================
function render(tr){
  tr=((tr%DURATION)+DURATION)%DURATION;
  const t=tr*SPEED;   // 기준 초

  // ---- [공용] 단계 문구: 제목 요소마다 나타남, 사라짐, 위치 ----
  const cI=P.caption.in/1000,cM=P.caption.move,CT=MotionSteps.captionTimes(T),EL=P.elements;
  const env=(tin,tout,custom)=>{const a=ioC(seg(t,tin,tin+cI));if(!custom){const b=ioC(seg(t,tout,tout+cI));return {o:a*(1-b),y:cM*(1-a)-cM*b};}
    const b=ioC(seg(t,tout,tout+0.2));return {o:a*(1-b),y:cM*(1-a)};};
  const elState=(n,part)=>{const e=EL[`cap${n}.${part}`],ct=CT[n];
    const tin=ct.tin<0&&e.in<=0?-1:Math.max(0,ct.tin)+e.in/1000,st=env(tin,ct.tout+e.out/1000,e.out!==0);
    if(ct.reenter!=null&&e.in<=0){const r=env(ct.reenter,1e9,false);return st.o>=r.o?st:r;}
    return st;};
  const vis=window._elVis={};
  for(const n in MotionSteps.CAPTIONS){const el=$('cap'+n),sT=elState(n,'title'),eT=EL[`cap${n}.title`];vis[`cap${n}.title`]=sT.o;
    show(el,sT.o);el.style.transform=eT.dx||eT.dy?`translateX(-50%) translate(${eT.dx}px,${sT.y+eT.dy}px)`:`translateX(-50%) translateY(${sT.y}px)`;}

  // ---- [기능마다] 장면 문장 2개: s<n>_sent1, s<n>_sent2 동안 0.3초 나타남(16px 위로), 칩과 함께 사라짐 ----
  for(const n in MotionSteps.SENTENCES){const off=1-ioC(seg(t,CT[n].tout,CT[n].tout+cI));
    [1,2].forEach(i=>{const st=T[`s${n}_sent${i}`],a=ioC(seg(t,st.s,st.e)),el=$(`sent${n}_${i}`);show(el,a*off);el.style.transform=`translateY(${16*(1-a)}px)`;});}

  // ---- [기능마다] 화면 ----
  const hw={o:1,dx:0},pg=page(t);   // 창을 바꾸는 장면이 없으면 hw 는 늘 보임(창 바꾸기는 예시 폴더 examples/usage-demo 참고)
  const cOn=cursorOn(t),cPos=cOn?cursorAt(t):null;
  show($('vA'),pg==='a'?1:0);show($('vB'),pg==='b'?1:0);
  // 창 안 흰색 거치기
  const ft=(t0,o,i)=>t<t0?0:t<t0+o?ioC(seg(t,t0,t0+o)):1-ioC(seg(t,t0+o,t0+o+i));
  const nv=id=>ft(T[id].s,T[id].v.out/1000,T[id].v.in/1000),lx=T.s1_loop.v;
  show($('veil'),Math.max(...NAVS.map(nv),ft(T.s1_loop.s,lx.out/1000,(lx.inDelay+lx.in-lx.out)/1000)));
  // 문제 박스
  for(const id in ISS){const r=T[id],a=ioC(seg(t,r.s,r.s+r.v.in/1000))*(1-ioC(seg(t,r.e-r.v.out/1000,r.e))),el=$('iss_'+id);
    show(el,t>=r.s&&t<=r.e?a:0);el.style.transform=`translateY(${6*(1-a)}px)`;}

  // ---- [공용] 강조 테두리 (선만) ----
  rings.forEach(r=>{const a=ioC(seg(t,r.t0,r.t0+r.fi))*(1-ioC(seg(t,r.t1-r.fo,r.t1)));
    if(a<=0.001||t>r.t1||t<r.t0){r.el.setAttribute('display','none');return;}
    const b=r.boxFn(t),pad=(r.pad||8)*b.s;r.el.removeAttribute('display');
    Object.entries({x:b.x-pad,y:b.y-pad,width:b.w+pad*2,height:b.h+pad*2,opacity:a}).forEach(([k,v])=>r.el.setAttribute(k,v));});

  // ---- [공용] 클릭 효과 (click-fx.js, 실제 시간), 커서 ----
  let press=1,discD=1e9,discC=null;
  clicks.forEach(c=>{const tc=c.tc/SPEED,d=(tr-tc)*1000,[x,y]=c.pt;
    if(c.dot){const a=seg(tr,tc-0.15,tc-0.07)*(1-seg(tr,tc+0.12,tc+0.35)),pz=1-0.14*seg(tr,tc-0.03,tc+0.01)*(1-seg(tr,tc+0.07,tc+0.12));
      show(c.dot,a);Object.assign(c.dot.style,{left:x+'px',top:y+'px',transform:`scale(${lerp(1.15,1,oC(seg(tr,tc-0.15,tc-0.05)))*pz})`});}
    const live=d>-400&&d<ClickFX.effectEnd(c.V,c.FP)+400;c.o.g.style.display=live?'':'none';c.o.els.forEach(e=>{if(!live)e.style.display='none';});
    if(live)ClickFX.renderOverlay(c.o,d,c.FP,{x,y,box:c.box,dark:c.dark,touch:c.touch,pointer:c.touch?null:cPos});
    if(!c.touch){press=Math.min(press,ClickFX.pressScale(d,c.FP));if(Math.abs(d)<Math.abs(discD)){discD=d;discC=c;}}});
  const cu=$('cursor'),co=cOn?1:0,discE=discC&&discC.V==='E',cd=$('curDisc');show(cu,co);show(cd,discE?co:0);
  if(co>0){const [x,y]=cPos;cu.style.transform=`translate(${x-2}px,${y-2}px) scale(${press})`;
    if(discE){const sz=ClickFX.discSize(discD,discC.FP);Object.assign(cd.style,{left:x-sz/2+'px',top:y-sz/2+'px',width:sz+'px',height:sz+'px'});}}
  clicks.forEach(c=>{c.o.g.style.opacity=hw.o;});   // 창이 사라지면 클릭 효과도 함께
}
window.render=render;

// ======================= [공용 틀] 화면 속 움직이는 요소 (편집기 연결 지점) =======================
window.hotspots=tr=>{
  const tb=tr*SPEED,ms=tb*1000,by=window.STEPS.by,out=[];
  const nm=id=>MotionSteps.STEPS.find(s=>s.id===id).name,on=(id,pre=0,post=0)=>by[id]&&ms>=by[id].start-pre&&ms<=by[id].end+post;
  const add=(id,kind,label,b)=>{if(b&&b.w>0&&b.h>0)out.push({stepId:id,kind,label:`${nm(id)} · ${label}`,rect:{x:b.x,y:b.y,w:b.w,h:b.h}});};
  const pad=(b,p)=>({x:b.x-p,y:b.y-p,w:b.w+2*p,h:b.h+2*p});
  moves.forEach(m=>{if(cursorOn(tb)&&on(m.id)){const [x,y]=cursorAt(tb);add(m.id,'glide','커서 이동',{x:x-14,y:y-10,w:40,h:52});}});
  clicks.forEach(c=>{const tail=(ClickFX.effectEnd(c.V,c.FP)+100)*SPEED;if(on(c.id,0,tail))add(c.id,'click','클릭 효과',pad(c.box,6));});
  rings.forEach(r=>{if(r.id&&on(r.id))add(r.id,'ring','강조',pad(r.boxFn(tb),r.pad||8));});
  return out.sort((a,b)=>a.rect.w*a.rect.h-b.rect.w*b.rect.h);
};

// ======================= [공용] 값 불러오기, 문구 적용 =======================
function clickParamsFrom(src){const all=ClickFX.defaults();
  if(src)for(const v in all)for(const k of ClickFX.effectKeys(v))for(const f in all[v][k]){const x=src[v]&&src[v][k]&&src[v][k][f];if(typeof x==='number'&&isFinite(x))all[v][k][f]=x;}
  return all;}
window.capEditing=0;
function applyCaptions(){for(const n in MotionSteps.CAPTIONS){if(window.capEditing===+n)continue;const el=$('cap'+n),d=MotionSteps.CAPTIONS[n],c=P.scenes[n]||{};
  const role=(c.role||'').trim()||d.role,title=(c.title||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,2).join('\n')||d.title;
  const key=role+'|'+title;if(el._k===key)continue;el._k=key;
  el.querySelector('.role').textContent=role;el.querySelector('.ttl').textContent=title.replace(/\n/g,' ');}}
window.captionOverflow=n=>$('cap'+n).offsetWidth>760;
function applyParams(state,clickSrc){P=MotionSteps.merge(state);CP=clickParamsFrom(clickSrc||P.clickParams);applyCaptions();rebuild();if(typeof draw==='function')draw();}
window.applyParams=applyParams;
function readLocal(){let s=null,c=null;try{s=JSON.parse(localStorage.getItem(MotionSteps.KEY));}catch(e){}try{c=(JSON.parse(localStorage.getItem(ClickFX.KEY))||{}).params;}catch(e){}return [s,c];}
async function loadParams(){   // 값 출처: ?params=local → localStorage(+실시간), 아니면 motion-params.json, 없으면 기본값
  if(LOCAL){applyParams(...readLocal());
    const ch=new BroadcastChannel(MotionSteps.CHANNEL);ch.onmessage=e=>{if(e.data&&e.data.type==='state')applyParams(e.data.state,e.data.clickParams);};
    const ct=new BroadcastChannel('clickTuner');ct.onmessage=e=>{if(e.data&&e.data.type==='state')applyParams(P,e.data.params);};
    addEventListener('storage',e=>{if(e.key===MotionSteps.KEY||e.key===ClickFX.KEY)applyParams(...readLocal());});
    return 'local';}
  try{const r=await fetch('motion-params.json',{cache:'no-store'});if(r.ok){const j=await r.json();applyParams(j,j.clickParams);return 'file';}}catch(e){}
  applyParams(null,null);return 'default';}
P=MotionSteps.defaults();rebuild();

// ======================= [공용] 재생, 조작 (t 는 실제 초) =======================
const BOX=q.get('box')==='1',EXPORT=q.get('export')==='1',EMBED=q.get('embed')==='1';
let now=q.has('t')?clamp(parseFloat(q.get('t'))||0,0,DURATION):0,playing=!q.has('t')&&!EXPORT&&!EMBED,last=null,zoomK=null;
const DECK=!EXPORT&&!EMBED&&!BOX;   // [기능마다] 발표 모드: 기본 보기 페이지(창에 꽉 차게, 가운데 정렬)
function layout(){const k=zoomK!=null?zoomK:EXPORT?1:BOX?1024/1920:DECK?Math.min(innerWidth/1920,innerHeight/1080):Math.min((innerWidth-40)/1920,(innerHeight-80)/1080);   // [기능마다] 발표 모드: DECK 배율
  $('stage').style.zoom=k;Object.assign($('wrap').style,{width:1920*k+'px',height:1080*k+'px'});$('ui').style.width=1920*k+'px';
  if(DECK)$('wrap').style.marginTop=Math.max(0,(innerHeight-1080*k)/2)+'px';}   // [기능마다] 발표 모드: 남는 높이는 위아래 같게(가운데)
window.setZoom=k=>{zoomK=k;layout();};
if(BOX)document.body.classList.add('box');
if(EXPORT||EMBED)document.body.classList.add('export');
if(DECK)document.documentElement.classList.add('deck');   // [기능마다] 발표 모드
addEventListener('resize',layout);layout();
function draw(){render(now);$('scrub').value=Math.round(now/DURATION*1000);$('tm').textContent=now.toFixed(2)+' s';
  if(window.presentUI)presentUI();}   // [기능마다] 발표 모드: 진행 표시, 이전 버튼
window.seek=t=>{now=clamp(t,0,DURATION);draw();};
function loop(ts){if(playing&&last!=null){const dt=(ts-last)/1000;
  now=DECK?presentStep(now,Math.min(dt,.25)):(now+dt)%DURATION;draw();}last=ts;requestAnimationFrame(loop);}   // [기능마다] 발표 모드: 기본 보기는 dt 상한 0.25초, 정지 안에서는 시간이 가지 않는다. ?box=1 은 엔진 그대로 반복 재생
$('pp').onclick=()=>{playing=!playing;};
$('scrub').oninput=e=>{playing=false;seek(e.target.value/1000*DURATION);};
addEventListener('keydown',e=>{if(EMBED||DECK)return;   // [기능마다] 발표 모드: 기본 보기의 키는 아래 발표 모드 절이 받는다
  if(e.code==='Space'){playing=!playing;e.preventDefault();}
  if(e.code==='ArrowRight'||e.code==='ArrowLeft'){playing=false;const s=(e.shiftKey?1:1/30)*(e.code==='ArrowRight'?1:-1);seek(((now+s)%DURATION+DURATION)%DURATION);e.preventDefault();}});
const IMGS=[...Object.values(IMG).map(([u])=>u)];
window.ready=Promise.all([loadParams(),...IMGS.map(u=>{const i=new Image();i.src=u;return i.decode();}),
  document.fonts.load('400 15px "Pretendard Variable"','가나 ab'),document.fonts.load('700 15px "Pretendard Variable"','가나 ab'),document.fonts.ready,
]).then(r=>{window.paramsSource=r[0];measure();rebuild();draw();if(!EXPORT&&!EMBED)requestAnimationFrame(loop);});
draw();
// ======================= [기능마다] 발표 모드 =======================
// 기본 보기(?box=1, ?export=1, ?embed=1 이 아닐 때)는 클릭으로 넘긴다.
// 정지 = 읽는 멈춤마다: 장면마다 문장 읽기 단계 s<n>_read1, s<n>_read2 [시작, 끝](문장이 다 나타난 뒤),
// ring 단계는 유지 1.6초 이상일 때 테두리와 문제 박스가 다 나타난 뒤 유지 구간 [시작 + in, 시작 + in + hold].
// 정지 시작이 앞 클릭의 물방울이 사라지기 전이면 물방울이 다 사라진 뒤로 미룬다(정지 끝을 넘지 않게).
// 마지막 loop 단계 와 그 뒤 단계는 처음으로 돌아가는 움직임이라 정지에 넣지 않는다.
// 자동 전환 끔: 움직임만 재생하고 다음 정지 시작에서 멈춘다. 켬: 원래 시간표대로 재생하고 마지막 정지 시작에서 멈춘다.
// 다음(무대 클릭, → Space Enter): 정지 안이면 그 정지 끝으로(다음 움직임 재생), 움직임 중이면 다음 정지 시작으로.
// 마지막 정지에서 다음: 처음으로 돌아가는 움직임을 끝까지 재생하고 0초부터 다시 재생해 첫 정지(장면 1 위 문장)에서 멈춘다.
// 이전([이전] 버튼, ←): 정지 k 안이거나 정지 k 로 가는 움직임 중이면 정지 k-1 시작으로. 첫 정지에서는 그대로.
// Cmd, Ctrl, Alt 를 같이 누르면 받지 않는다. ?box=1, ?export=1, ?embed=1 에서는 조작 요소를 숨기고 바꾸기 전 엔진대로 재생한다.
const EPS=1e-6;   // 정지 경계 비교 허용 오차
const READ=1.6;   // 읽는 멈춤으로 보는 최소 길이(기준 초)
const stops=()=>{const C=window.STEPS,o=[];
  const fxEnd=s=>Math.max(s,...clicks.filter(c=>c.tc/SPEED<=s).map(c=>c.tc/SPEED+ClickFX.effectEnd(c.V,c.FP)/1000));   // 앞 클릭 물방울이 다 사라진 실제 초
  const add=(id,s,e)=>o.push({id,s:Math.min(fxEnd(s/SPEED),e/SPEED),e:e/SPEED});
  for(const x of C.list){if(x.type==='loop')break;
    const s=x.start/1000,e=x.end/1000;
    if(x.type==='hold'&&/_read\d$/.test(x.id))add(x.id,s,e);
    else if(x.type==='ring'&&x.v.hold/1000>=READ)add(x.id,s+x.v.in/1000,s+(x.v.in+x.v.hold)/1000);}
  return o;};
window.stops=stops;
// t 의 정지 번호 k 와 정지 안인지. 움직임 중이면 그 움직임이 향하는 정지. 마지막 정지 뒤는 k = 정지 수(처음으로 돌아가는 움직임)
function stopAt(t){const S=stops(),k=S.findIndex(x=>x.e>t+EPS);
  return k<0?{S,k:S.length,inStop:false}:{S,k,inStop:S[k].s<=t+EPS};}
let autoOn=q.get('auto')==='1';   // 저장하지 않는다
function presentStep(t,dt){const {S,k,inStop}=stopAt(t);
  if(k===S.length)return t+dt>=DURATION?0:t+dt;   // 처음으로 돌아가는 움직임: 끝까지 재생하고 0초부터 첫 정지까지 재생한다
  if(autoOn)return Math.min(t+dt,S[S.length-1].s);
  return inStop?t:Math.min(t+dt,S[k].s);}
function advance(){const {S,k,inStop}=stopAt(now);
  now=k===S.length?S[0].s:inStop?S[k].e:S[k].s;playing=true;draw();}
function back(){const {S,k}=stopAt(now);
  if(k<1)return;
  now=S[k-1].s;playing=true;draw();}
window.advance=advance;window.back=back;
window.presentUI=()=>{if(!DECK)return;
  const {S,k}=stopAt(now),n=k===S.length?1:k+1,txt=n+' / '+S.length;   // 움직임 중에는 향하는 정지 번호
  if($('progN').textContent!==txt)$('progN').textContent=txt;
  $('prev').disabled=k<1;};
if(DECK){
  $('stage').addEventListener('click',e=>{if(e.target.closest('#prev,#autoLbl'))return;advance();});
  $('prev').addEventListener('click',()=>{back();$('prev').blur();});
  $('auto').checked=autoOn;
  $('auto').addEventListener('change',()=>{autoOn=$('auto').checked;draw();});
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.target.tagName==='BUTTON'&&(e.code==='Enter'||e.code==='Space'))return;   // 버튼은 자기 동작만
    if(e.code==='ArrowLeft'){e.preventDefault();if(!e.repeat)back();return;}
    if(e.target.tagName==='INPUT'&&e.code==='Space')return;   // 체크박스에서 Space 는 체크만 바꾼다(→, Enter 는 넘긴다)
    if(e.code==='ArrowRight'||e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)advance();}});
  draw();
}
// 숨은 글(문장, 문제 박스, 칩)이 쓰는 글꼴 조각을 모두 불러온 뒤 다시 잰다(숨은 글은 브라우저가 미리 불러오지 않는다)
const sceneText=[...Object.values(MotionSteps.SENTENCES).flat(),...Object.values(ISS).map(x=>x.txt),...Object.values(MotionSteps.CAPTIONS).map(c=>c.role+c.title),$('app').textContent].join('')+'0123456789';
window.ready=window.ready.then(()=>Promise.all([...[400,500,600,700,800].map(w=>document.fonts.load(w+' 40px "Pretendard Variable"',sceneText))]))
  .then(()=>document.fonts.ready).then(()=>{measure();draw();});
</script>
</body>
